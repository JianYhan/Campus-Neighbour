server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:54329/campus}
    username: ${DB_USER:campus}
    password: ${DB_PASSWORD:campus-local}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:63799}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  session:
    redis:
      namespace: campus:session
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
campus:
  uploads: ${UPLOAD_ROOT:.data/uploads}
  origin: ${PUBLIC_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
  demo: ${DEMO_DATA_ENABLED:false}
springdoc:
  swagger-ui:
    path: /docs
